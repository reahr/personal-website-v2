<section class="hero">
    <div class="eyebrow">
        <span class="rule"></span>
        <span class="eyebrow-text">Product Design&nbsp;/&nbsp;Product Management&nbsp;/&nbsp;Front-End Engineer</span>
        <span class="rule"></span>
    </div>
    <h1><span class="normal">Hi there, I'm </span><i>Reah</i>!</h1>
    <p class="lede">I design products and ship them. With roots in engineering and design, I lead the work from first research to launch, then measure what it moves.</p>
</section>

<section id="work" class="work-section">
    <div class="work-header">
        <h2>Selected <i>work</i></h2>
        <span class="count">{{ caseStudyService.caseStudies.length }} case studies</span>
    </div>
    <div class="work-grid">
        <ng-container *ngFor="let item of caseStudyService.caseStudies">
            <app-case-study-card [caseStudy]="item"></app-case-study-card>
        </ng-container>
    </div>
</section>
