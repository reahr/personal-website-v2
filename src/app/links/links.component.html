<div class="links-page">
  <div class="links-card">

    <div class="intro">
      <h1><span class="normal">Hi there, I'm</span> Reah!</h1>
      <p>Product, design, and a few things worth building.</p>
    </div>

    <div class="link-list">
      <ng-container *ngFor="let link of links">
        <a *ngIf="link.routerLink; else externalLink" class="rd-link" [routerLink]="link.routerLink">
          <ng-container *ngTemplateOutlet="tileContent; context: { $implicit: link }"></ng-container>
        </a>
        <ng-template #externalLink>
          <a class="rd-link" [href]="link.href" [target]="link.external ? '_blank' : null" [rel]="link.external ? 'noopener' : null">
            <ng-container *ngTemplateOutlet="tileContent; context: { $implicit: link }"></ng-container>
          </a>
        </ng-template>
      </ng-container>

      <ng-template #tileContent let-link>
        <span class="rd-link-label">
          <img *ngIf="link.icon" class="rd-link-icon" [src]="link.icon" alt="">
          {{ link.label }}
        </span>
        <svg class="rd-link-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </ng-template>
    </div>

    <div class="project-section" *ngIf="projects.length">
      <h2>Amazon Favorites</h2>
      <a class="rd-project-card" *ngFor="let project of projects" [href]="project.href" target="_blank" rel="noopener">
        <img [src]="project.image" [alt]="project.alt">
      </a>
    </div>

    <div class="social-list">
      <a class="rd-social" href="mailto:reah@taurestia.com" aria-label="Email">
        <svg width="18" height="18" viewBox="0 0 36.036 36.036" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M18.018 36.036C27.9691 36.036 36.036 27.9691 36.036 18.018C36.036 8.06694 27.9691 0 18.018 0C8.06694 0 0 8.06694 0 18.018C0 27.9691 8.06694 36.036 18.018 36.036ZM6.88837 26.6703C7.35149 27.1334 7.90822 27.3649 8.55855 27.3649H27.4775C28.1278 27.3649 28.6845 27.1334 29.1477 26.6703C29.6108 26.2071 29.8423 25.6504 29.8423 25.0001V10.8109C29.8423 10.1605 29.6108 9.60381 29.1477 9.14069C28.6845 8.67757 28.1278 8.44601 27.4775 8.44601H8.55855C7.90822 8.44601 7.35149 8.67757 6.88837 9.14069C6.42525 9.60381 6.19369 10.1605 6.19369 10.8109V25.0001C6.19369 25.6504 6.42525 26.2071 6.88837 26.6703ZM27.4775 13.1757L18.018 19.0879L8.55855 13.1757V10.8109L18.018 16.723L27.4775 10.8109V13.1757Z" fill="currentColor"></path></svg>
      </a>
    </div>

    <p class="footnote">Thanks for stopping by — more soon.</p>

  </div>
</div>
